QueryLanguage: JSONata
Comment: >
  Agentic autocoding workflow, built on the AgentCore Harness integration.
  One execution codes one clinical verbatim from the study_terms table:
  deterministic direct lookup
  (block-list guard + exact/synonym match) -> agentic semantic search
  (AgentCore Harness + pgvector search_dictionary tool) -> score-threshold
  routing -> write-back onto the same study_terms row. Standard workflow:
  exactly-once, and the execution history is a per-term audit trail. An
  un-coded term is a valid business outcome, not a workflow failure - every
  error path lands on MarkOpen. Uses JSONata (not JSONPath):
  Arguments/Output instead of Parameters/ResultPath, {% %} expressions, and
  workflow variables via Assign - see
  https://docs.aws.amazon.com/step-functions/latest/dg/transforming-data.html
StartAt: CaptureInput
States:
  # Capture the execution input (one study_terms row) into JSONata workflow
  # variables BEFORE any fallible state runs, so every state - including the
  # MarkOpen error sink reached from a Catch - can reference them. Task
  # Assigns only run on success, so doing this in the Task itself would
  # leave $recordId undefined on the error path. Execution input:
  #   {"record_id": "...", "verbatim": "migrane",
  #    "encoding_dictionary": "MedDRA",
  #    "encoding_dictionary_version": "v27.0",
  #    "source_study": "ONCO-2024-01",
  #    "derivation_only": false}
  #
  # source_study is what the agent passes to get_study_info. Every term
  # entering the agentic path must carry the verbatim, the dictionary it is
  # coded against, AND the study it belongs to - the study is what lets the
  # agent break ties the dictionary text alone cannot.
  CaptureInput:
    Type: Pass
    Assign:
      recordId: "{% $states.input.record_id %}"
      verbatim: "{% $states.input.verbatim %}"
      dictionary: "{% $states.input.encoding_dictionary %}"
      dictionaryVersion: "{% $states.input.encoding_dictionary_version %}"
      study: "{% $states.input.source_study %}"
      # equality with a missing field is false, so this normalizes an
      # omitted derivation_only to false
      derivationOnly: "{% $states.input.derivation_only = true %}"
    Next: CheckDirect

  # State 1+2 (deterministic, no LLM) - block-list guard + exact/synonym
  # match in one Lambda. Returns a tri-state result:
  #   blocked=true             -> MarkOpen (safety block, not "no match")
  #   matched=true + candidate -> WriteBack (deterministic autocode, score 1.0)
  #   neither                  -> CodingAgent (semantic search)
  CheckDirect:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: "${CheckDirectFunctionArn}"
      Payload:
        verbatim: "{% $verbatim %}"
        encoding_dictionary: "{% $dictionary %}"
        encoding_dictionary_version: "{% $dictionaryVersion %}"
    Assign:
      direct: "{% $states.result.Payload %}"
    Retry:
      - ErrorEquals:
          - Lambda.TooManyRequestsException
          - Lambda.ServiceException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2.0
    Catch:
      - ErrorEquals: ["States.ALL"]
        Next: MarkOpen
    Next: RouteDirect

  RouteDirect:
    Type: Choice
    Choices:
      # CASE C - block-list hit -> stays open (safety block, not "no match").
      - Condition: "{% $direct.blocked %}"
        Next: MarkOpen
      # CASE A/B/G - unique exact or synonym match -> deterministic autocode
      # at score 1.00.
      - Condition: "{% $direct.matched %}"
        Next: WriteBack
    # Miss -> bounded agent reasoning over the pgvector candidates.
    Default: CodingAgent

  # State 3 (agentic semantic search) - AgentCore Harness, invoked
  # declaratively via the native optimized Step Functions integration. The
  # CfnHarness CDK resource (lib/constructs/coding-harness.ts) only declares
  # the fields CloudFormation requires (ExecutionRoleArn, HarnessName,
  # Model) - everything else is supplied here per-invocation, since
  # InvokeHarness documents every field below Messages/HarnessArn/
  # RuntimeSessionId as optional, overriding the harness default only when
  # specified. See
  # https://docs.aws.amazon.com/bedrock-agentcore/latest/APIReference/API_InvokeHarness.html
  #
  # The agent has two tools, both via the Gateway:
  #   search_dictionary - pgvector cosine kNN over the dictionary_terms
  #                       embedding column; returns candidate terms
  #   get_study_info    - the study's free-text metadata description
  #
  # The second tool exists because similarity search can return several
  # clinically plausible candidates it cannot separate on text alone. A human
  # coder breaks that tie using study context; this gives the agent the same
  # context. Selecting among close candidates is the part that cannot be
  # reduced to code, which is why this step is an agent and not a Lambda.
  #
  # The agent returns the single chosen candidate as JSON; the Assign below
  # parses that text and normalizes the confidence score, and ScoreThreshold
  # routes on it. A malformed (non-JSON) answer fails the $parse in Assign,
  # which the Catch routes to MarkOpen - "no confident code" is a valid,
  # deliberate outcome, not a workflow failure.
  CodingAgent:
    Type: Task
    Resource: arn:aws:states:::bedrockagentcore:invokeHarness
    Arguments:
      # --- Required ---
      HarnessArn: "${CodingHarnessArn}"
      # $uuid() is a Step Functions-provided JSONata function (>= 33 chars,
      # required by RuntimeSessionId).
      RuntimeSessionId: "{% $uuid() %}"
      Messages:
        - Role: user
          Content:
            - Text: >-
                {% 'Code this verbatim term: "' & $verbatim & '". Dictionary='
                & $dictionary & ' version=' & $dictionaryVersion
                & ' study=' & $study & '.' %}

      # --- Optional: business logic for this demo needs these ---
      Tools:
        - Type: agentcore_gateway
          Name: gateway
          Config:
            AgentCoreGateway:
              GatewayArn: "${GatewayArn}"
      # Gateway-sourced tools are scoped with the `@server/tool` pattern,
      # where `server` is this tool entry's `Name` ("gateway") and `tool` is
      # the REAL fully-qualified MCP tool name: "{target_name}___{tool_name}"
      # (triple underscore) - the targets are named "search-dictionary" and
      # "study-info" (see coding-gateway.ts's gatewayTargetName), the tools
      # are "search_dictionary" and "get_study_info", so the real names are
      # "search-dictionary___search_dictionary" and
      # "study-info___get_study_info", NOT the bare tool names.
      # Root cause of an earlier bug with a previous placeholder tool:
      # AllowedTools listed the bare tool name, which matched nothing, so the
      # tool was silently filtered out and the model fell back to answering
      # from its own "knowledge" instead of erroring.
      AllowedTools:
        - "@gateway/search-dictionary___search_dictionary"
        - "@gateway/study-info___get_study_info"
      # A coding prompt with hard constraints: the agent must ground its
      # answer in real search_dictionary results and copy every value
      # verbatim. Study metadata is context for CHOOSING among those
      # candidates - never a source of codes. Unlike an "abstain" prompt, it
      # always returns a candidate - even at a low score - and lets the
      # workflow's ScoreThreshold Choice state (configuration, not model
      # judgment) decide autocode vs human review vs open. WriteBack
      # additionally validates that a non-open result carries a
      # dict_term_code, so fabricated or empty answers stand out.
      SystemPrompt:
        - Text: |-
            You are a clinical medical-coding expert. Your goal is to code one
            free-text verbatim term against one specified dictionary, for one
            specified study, by choosing the best entry from the candidates a
            search tool returns.

            You have two tools:
            - search_dictionary: returns candidate dictionary entries for a
              verbatim term, with codes, hierarchies and similarity scores.
            - get_study_info: returns a study's name and its free-text
              metadata description (therapeutic area, adverse events of
              special interest, expected concomitant medications).

            Rules, in order of priority:
            1. The user's message contains a verbatim term, a dictionary
               name, a dictionary version and a study. Call
               search_dictionary FIRST, with that verbatim term (exactly as
               given, do not correct spelling) and that dictionary and
               dictionary_version.
            2. If exactly one candidate clearly fits the verbatim's clinical
               meaning, select it and skip step 3.
            3. If several candidates are clinically plausible, or the top
               candidates differ in body system / drug class, call
               get_study_info once with the study from the user's message.
               Use the study description - what the trial is investigating,
               which events it monitors, which medications are expected - to
               judge which candidate best fits this study's clinical context,
               the way a human coder who knows the study would.
            4. Select the SINGLE best candidate. If nothing is a good fit,
               still select the top-scoring candidate - its low score lets
               the caller decide; never abstain and never answer from your
               own knowledge.
            5. Respond with ONLY this JSON object, copying every value
               EXACTLY as returned by search_dictionary for your selected
               candidate:
               {"dict_term":"<dict_term>","dict_term_type":"<dict_term_type>","dict_term_code":"<dict_term_code>","derivation":"<derivation>","hierarchy":<hierarchy>,"score":<score>,"rationale":"<one sentence>"}

            Hard constraints:
            - Your dict_term_code MUST be one of the codes search_dictionary
              returned. Never output a code that was not among those
              candidates.
            - Study metadata is context for CHOOSING between candidates only.
              It never introduces, replaces or overrides a code, and any term
              or number appearing in a study description is NOT selectable.
            - Never invent, alter, or "correct" codes, names, hierarchies or
              scores - copy them verbatim from the search_dictionary output.
            - In rationale, state in one sentence why you chose this
              candidate, and name the study context if it drove the choice.
            - Never explain, apologize, or say you don't know or can't help.
            - Output ONLY the JSON object. The FIRST character of your reply
              must be "{" and the LAST must be "}". Put your reasoning in the
              rationale field - never before or after the JSON. No preamble,
              no summary, no markdown code fences.
    Assign:
      # The assistant text should be exactly the JSON object the system prompt
      # mandates, but models reliably drift into narrating before it once the
      # prompt asks them to reason (an observed regression: adding the
      # rationale field made every agent-path answer start with prose, so a
      # bare $parse of the whole reply failed with "Invalid JSON" and the
      # Catch below silently routed correctly-coded terms to MarkOpen).
      # So extract the JSON object from the reply - greedy first "{" to last
      # "}" - instead of trusting the model to emit nothing else. A reply with
      # no JSON at all still raises States.QueryEvaluationError -> Catch ->
      # MarkOpen, which is the intended "no confident code" outcome.
      agentCandidate: >-
        {% $parse($match($states.result.Output.Message.Content[0].Text,
        /\{[\s\S]*\}/)[0].match) %}
      # Normalized routing score: a missing or non-numeric score counts as 0,
      # so ScoreThreshold (a Choice state, which cannot Catch) never errors.
      agentScore: >-
        {% ($s := $parse($match($states.result.Output.Message.Content[0].Text,
        /\{[\s\S]*\}/)[0].match).score;
        $type($s) = 'number' ? $s : 0) %}
    Retry:
      - ErrorEquals:
          - BedrockAgentCore.ThrottlingException
          - BedrockAgentCore.InternalServerException
        IntervalSeconds: 3
        MaxAttempts: 3
        BackoffRate: 2.0
    Catch:
      - ErrorEquals: ["States.ALL"]
        Next: MarkOpen
    Next: ScoreThreshold

  # Route on the agent's confidence score. Thresholds are configuration in
  # the state machine definition, not code - tune them without touching the
  # agent. CASE D (>= 0.90) autocode; CASE E (0.70-0.90) human review;
  # CASE F (< 0.70) leave open for manual coding.
  ScoreThreshold:
    Type: Choice
    Choices:
      - Condition: "{% $agentScore >= 0.9 %}"
        Next: WriteBack
      - Condition: "{% $agentScore >= 0.7 %}"
        Next: MarkForReview
    Default: MarkOpen

  # State 4 (write-back) - persist the code onto the study_terms row in
  # place: status=autocoded, dict_term, dict_term_code, derivation,
  # hierarchy, match_score. Reached from both paths; JSONata conditionals
  # only evaluate the selected branch, so referencing $agentCandidate is
  # safe when arriving from the deterministic hit. For derivation_only=true
  # (WHODrug/EDC, CASE H) only derivation + hierarchy are written. WriteBack
  # rejects a candidate without a dict_term_code (fabrication guard); the
  # Catch turns that into MarkOpen so the record safely stays open.
  WriteBack:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: "${WriteBackFunctionArn}"
      Payload:
        record_id: "{% $recordId %}"
        target_status: autocoded
        candidate: "{% $direct.matched ? $direct.candidate : $agentCandidate %}"
        derivation_only: "{% $derivationOnly %}"
        encoding_dictionary: "{% $dictionary %}"
        encoding_dictionary_version: "{% $dictionaryVersion %}"
    Output: "{% $states.result.Payload %}"
    Retry:
      - ErrorEquals:
          - Lambda.TooManyRequestsException
          - Lambda.ServiceException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2.0
    Catch:
      - ErrorEquals: ["States.ALL"]
        Next: MarkOpen
    End: true

  # Write the candidate code and set status=approval_required so it surfaces
  # in the human coder queue for one-click confirm/override.
  MarkForReview:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: "${WriteBackFunctionArn}"
      Payload:
        record_id: "{% $recordId %}"
        target_status: approval_required
        candidate: "{% $agentCandidate %}"
        derivation_only: "{% $derivationOnly %}"
        encoding_dictionary: "{% $dictionary %}"
        encoding_dictionary_version: "{% $dictionaryVersion %}"
    Output: "{% $states.result.Payload %}"
    Retry:
      - ErrorEquals:
          - Lambda.TooManyRequestsException
          - Lambda.ServiceException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2.0
    Catch:
      - ErrorEquals: ["States.ALL"]
        Next: MarkOpen
    End: true

  # No confident code (or an upstream error). Leave status=open for a human
  # coder. Terminal, non-failing - an un-coded term is a valid business
  # outcome, not a workflow failure.
  MarkOpen:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: "${WriteBackFunctionArn}"
      Payload:
        record_id: "{% $recordId %}"
        target_status: open
    Output: "{% $states.result.Payload %}"
    Retry:
      - ErrorEquals:
          - Lambda.TooManyRequestsException
          - Lambda.ServiceException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2.0
    End: true
